name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci` over `install` so the lockfile is authoritative — this is what
      # caught @cloudflare/next-on-pages pinning Next to a version with a
      # critical RCE.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production dependencies only — a vulnerable build-time package is not
      # reachable by visitors, so gating on those would just be noise.
      #
      # Gated at `critical`, not `high`: Next bundles its own postcss and sharp,
      # and npm's only offered remedy for those is `next@9.3.3`. Gating at high
      # would leave this check permanently red, which trains people to ignore
      # it. `critical` still catches the class of issue that matters — it is
      # what CVE-2025-55182 (RCE, CVSS 10.0) scored.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
